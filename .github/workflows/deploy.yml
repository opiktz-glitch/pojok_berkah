name: Deploy to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show planned changes without uploading files
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: infinityfree-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && (vars.POJOK_BERKAH_DEPLOY_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) }}
    runs-on: ubuntu-latest
    # Shared hosting FTP can be slow, so stop well before the 360 minute default.
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify deployment secrets
        env:
          FTP_SERVER: ${{ secrets.INFINITYFREE_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.INFINITYFREE_FTP_SERVER_DIR }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ] || [ -z "$FTP_SERVER_DIR" ]; then
            echo "::error::Add the four INFINITYFREE_FTP_* repository secrets before enabling deployment."
            exit 1
          fi

      - name: Deploy with explicit FTPS
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.INFINITYFREE_FTP_SERVER }}
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ${{ secrets.INFINITYFREE_FTP_SERVER_DIR }}
          # The transfer stays encrypted, but InfinityFree serves TLS on a
          # shared hostname, so the certificate itself is not validated.
          security: loose
          # Shared hosting FTP is slow, so allow 60 seconds per operation.
          timeout: 60000
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            .gitignore
            README.md
            data/storage.php
            data/storage.example.php
            data/uploads/*.jpg
            data/uploads/*.jpeg
            data/uploads/*.png
            data/uploads/*.webp
